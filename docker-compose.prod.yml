# ===========================================
# Production config для Beget VPS
# Использует внешнюю БД PostgreSQL (Beget Cloud Database)
# Redis и Celery worker/beat — в этом compose
# Лимиты памяти под 4 ГБ RAM (сервер 3/4).
# После up проверить применение: docker stats --no-stream
# ===========================================

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    volumes:
      - ./docs:/docs:ro
    expose:
      - "8000"
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment:
      REDIS_DSN: "redis://redis:6379/0"
    command: celery -A app.celery_app worker -l info
    depends_on:
      - redis
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment:
      REDIS_DSN: "redis://redis:6379/0"
    command: celery -A app.celery_app beat -l info
    depends_on:
      - redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BUILD_TIMESTAMP: "0"
    expose:
      - "80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # Certbot для SSL (опционально, запускается вручную)
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h; done'"

volumes:
  redis_data:

# Примечание: PostgreSQL — внешняя Beget Cloud Database.
# REDIS_DSN в .env задать как redis://redis:6379/0
