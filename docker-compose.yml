services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    command: celery -A app.celery_app worker -l info
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    ports:
      - "5173:5173"

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-birka}
      POSTGRES_USER: ${POSTGRES_USER:-birka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birka}
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
